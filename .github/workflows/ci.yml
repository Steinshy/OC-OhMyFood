name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint HTML
        run: pnpm run lint:html

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Check formatting
        run: pnpm run format:check

      - name: Check minified CSS is up to date
        run: |
          pnpm run build:css
          git diff --exit-code css/
